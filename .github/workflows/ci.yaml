name: CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Xvfb for the UI tests
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run tests
        run: xvfb-run -a pytest
        env:
          REQUIRE_UI_TESTS: "1"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pylint
        run: pylint src --rcfile=.pylintrc --fail-under=9.5

      - name: Run flake8
        run: flake8 src test

      - name: Check formatting
        run: black --check src test

      - name: Run mypy
        run: mypy
